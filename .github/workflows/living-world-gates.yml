name: Living world gates
on:
  pull_request:
    paths:
      - 'api/living-world*'
      - 'src/living-world*'
      - 'src/world-manifest.js'
      - 'src/world-materialization.js'
      - 'supabase/migrations/**'
      - 'scripts/*living-world*'
      - 'scripts/*world-materialization*'
      - 'scripts/*earth*'
      - 'vercel.json'
      - 'package*.json'
      - '.github/workflows/living-world-gates.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:living-world
      - run: npm run check:earth-region-postgres
      - run: npm run check
      - name: Configure local Vercel build
        run: |
          mkdir -p .vercel
          printf '%s' '{"projectId":"prj_1l1tzmumNW4LAWQmvDDC9oMDeC4v","orgId":"team_8608EfcapFF0iJf9AomkK2GV","projectName":"zillions","settings":{"framework":null,"nodeVersion":"24.x"}}' > .vercel/project.json
      - run: npx vercel build --prod
        env:
          VERCEL_ORG_ID: team_8608EfcapFF0iJf9AomkK2GV
          VERCEL_PROJECT_ID: prj_1l1tzmumNW4LAWQmvDDC9oMDeC4v
