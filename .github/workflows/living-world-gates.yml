name: Living world gates
on:
  pull_request:
    paths:
      - 'api/living-world*'
      - 'src/living-world*'
      - 'supabase/migrations/**'
      - 'scripts/*living-world*'
      - 'scripts/*world-materialization*'
      - 'scripts/*earth*'
      - 'vercel.json'
      - 'package*.json'
      - '.github/workflows/living-world-gates.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:living-world
      - run: npm run check:earth-region-postgres
      - run: npm run check
